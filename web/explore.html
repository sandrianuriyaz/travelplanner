<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Travel Planner" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelajahi Destinasi — Travel Planner</title>
  <link rel="stylesheet" href="dist/output.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family:'Inter',sans-serif; background:#f0f9ff; }
    .font-display { font-family:'Plus Jakarta Sans',sans-serif; }
    .glass { background:rgba(255,255,255,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.5); }
    .sidebar-link { display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:500;transition:all .2s;color:#475569; }
    .sidebar-link:hover { background:rgba(255,255,255,.4);color:#0d9488; }
    .sidebar-link.active { background:linear-gradient(135deg,#0d9488,#2563eb);color:#fff; }
    ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:rgba(13,148,136,.2);border-radius:9px; }
    .dest-card { transition:all .25s; cursor:pointer; }
    .dest-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.1); }
    #modal-peta { height:260px; border-radius:16px; overflow:hidden; }
    .chip { padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; border:1.5px solid #e2e8f0; transition:all .2s; background:#fff; color:#475569; }
    .chip.active { background:#0d9488; border-color:#0d9488; color:#fff; }
    .skeleton { background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; border-radius:16px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body class="min-h-screen">

<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-full w-64 glass shadow-2xl z-50 flex flex-col overflow-hidden">
  <div class="p-5 border-b border-white/30">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-600 to-blue-600 flex items-center justify-center shadow">
        <span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">sailing</span>
      </div>
      <span class="font-display font-black text-teal-800">Travel Planner</span>
    </div>
    <nav class="space-y-1">
      <a href="dashboard.html" class="sidebar-link"><span class="material-symbols-outlined text-[18px]">dashboard</span>Dashboard</a>
      <a href="generate.html" class="sidebar-link"><span class="material-symbols-outlined text-[18px]">auto_awesome</span>Buat Itinerary</a>
      <a href="map.html" class="sidebar-link"><span class="material-symbols-outlined text-[18px]">map</span>Peta Destinasi</a>
      <a href="explore.html" class="sidebar-link active"><span class="material-symbols-outlined text-[18px]">travel_explore</span>Jelajahi</a>
    </nav>
  </div>

  <!-- Filter -->
  <div class="p-4 border-b border-white/30">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Filter</p>
    <div class="relative mb-3">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
      <input id="search-input" type="text" placeholder="Cari destinasi..."
        class="w-full border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-teal-400"
        oninput="applyFilter()" />
    </div>
    <select id="kota-select" onchange="applyFilter()"
      class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-teal-400 mb-2">
      <option value="">Semua Kota</option>
    </select>
  </div>

  <!-- Stats -->
  <div class="p-4 space-y-2">
    <div class="glass rounded-2xl p-3 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-teal-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-teal-600 text-[16px]" style="font-variation-settings:'FILL' 1">location_on</span>
      </div>
      <div>
        <p id="stat-total" class="font-display font-bold text-slate-800 text-sm">—</p>
        <p class="text-xs text-slate-400">Total Destinasi</p>
      </div>
    </div>
    <div class="glass rounded-2xl p-3 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-blue-600 text-[16px]" style="font-variation-settings:'FILL' 1">category</span>
      </div>
      <div>
        <p id="stat-kategori" class="font-display font-bold text-slate-800 text-sm">—</p>
        <p class="text-xs text-slate-400">Kategori</p>
      </div>
    </div>
  </div>

  <!-- User -->
  <div class="mt-auto p-4 border-t border-white/20">
    <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/40 mb-2">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-teal-500 to-blue-600 flex items-center justify-center text-white font-bold text-sm" id="avatar">?</div>
      <div class="overflow-hidden flex-1">
        <p class="text-sm font-bold text-teal-800 truncate" id="uname">—</p>
        <p class="text-xs text-slate-400 truncate" id="uemail">—</p>
      </div>
    </div>
    <button onclick="auth.logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-red-400 hover:bg-red-50 transition-all text-sm">
      <span class="material-symbols-outlined text-[18px]">logout</span>Keluar
    </button>
  </div>
</aside>

<!-- Main Content -->
<main class="ml-64 p-8 min-h-screen">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="font-display font-black text-3xl text-teal-900">Jelajahi Destinasi</h1>
    <p class="text-slate-500 mt-1" id="subtitle">Memuat destinasi...</p>
  </div>

  <!-- Kategori Chips -->
  <div id="chips-container" class="flex flex-wrap gap-2 mb-6"></div>

  <!-- Grid -->
  <div id="dest-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
</main>

<!-- Modal Detail -->
<div id="modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-6">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="tutupModal()"></div>
  <div class="relative glass rounded-3xl w-full max-w-lg shadow-2xl border border-white/60 overflow-hidden">
    <!-- Peta Mini -->
    <div id="modal-peta"></div>

    <div class="p-6">
      <!-- Badge Kategori -->
      <div id="modal-kat" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold mb-3"></div>
      <h2 id="modal-nama" class="font-display font-black text-2xl text-slate-900 mb-1"></h2>
      <p id="modal-kota" class="text-slate-500 text-sm mb-5 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">location_on</span>
        <span></span>
      </p>

      <!-- Stats -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-teal-50 rounded-2xl p-4 text-center">
          <p class="text-xs font-bold text-teal-600 uppercase tracking-wide mb-1">Harga Tiket</p>
          <p id="modal-fee" class="font-display font-black text-teal-900 text-lg"></p>
        </div>
        <div class="bg-blue-50 rounded-2xl p-4 text-center">
          <p class="text-xs font-bold text-blue-600 uppercase tracking-wide mb-1">Durasi Kunjungan</p>
          <p id="modal-dur" class="font-display font-black text-blue-900 text-lg"></p>
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="tutupModal()" class="flex-1 py-3 rounded-2xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-all">
          Tutup
        </button>
        <a id="modal-plan-btn" href="generate.html"
          class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-teal-500 to-blue-600 text-white text-sm font-display font-bold text-center shadow-lg hover:shadow-teal-400/40 active:scale-95 transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[16px]" style="font-variation-settings:'FILL' 1">auto_awesome</span>
          Rencanakan
        </a>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  auth.requireAuth();

  const user = auth.getUser();
  if (user) {
    document.getElementById('uname').textContent = user.username;
    document.getElementById('uemail').textContent = user.email;
    document.getElementById('avatar').textContent = user.username[0].toUpperCase();
  }

  const WARNA = {
    'Budaya':'#ea580c','Bahari':'#0284c7','Cagar Alam':'#16a34a',
    'Taman Hiburan':'#9333ea','Taman Wisata Alam':'#0d9488',
    'Default':'#0d9488',
  };
  const ICON = {
    'Budaya':'museum','Bahari':'waves','Cagar Alam':'forest',
    'Taman Hiburan':'attractions','Taman Wisata Alam':'nature',
    'Default':'location_on',
  };

  let semuaDest = [];
  let filtered  = [];
  let miniMap   = null;
  let activeKat = '';

  function getWarna(kat) { return WARNA[kat] || WARNA.Default; }
  function getIcon(kat)  { return ICON[kat]  || ICON.Default; }

  function formatRp(n) {
    return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
  }

  // ── Muat destinasi ────────────────────────────────────────────────
  async function muat() {
    renderSkeleton();
    try {
      const res = await api.destinasi.semua();
      semuaDest = res.data;
      muatKota();
      muatChips();
      applyFilter();
      updateStats();
    } catch (e) {
      document.getElementById('dest-grid').innerHTML =
        `<div class="col-span-full text-center py-20 text-slate-400">${e.message}</div>`;
    }
  }

  function renderSkeleton() {
    const grid = document.getElementById('dest-grid');
    grid.innerHTML = Array(8).fill(`
      <div class="skeleton h-52"></div>
    `).join('');
  }

  function muatKota() {
    const kota = [...new Set(semuaDest.map(d => d.city))].sort();
    const sel = document.getElementById('kota-select');
    kota.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = k;
      sel.appendChild(opt);
    });
  }

  function muatChips() {
    const kategori = [...new Set(semuaDest.map(d => d.category))].sort();
    const container = document.getElementById('chips-container');
    container.innerHTML = `<button class="chip active" onclick="setKat('')">Semua</button>` +
      kategori.map(k =>
        `<button class="chip" onclick="setKat('${k}')">${k}</button>`
      ).join('');
  }

  function setKat(kat) {
    activeKat = kat;
    document.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active',
        kat === '' ? c.textContent === 'Semua' : c.textContent === kat
      );
    });
    applyFilter();
  }

  function applyFilter() {
    const q   = document.getElementById('search-input').value.toLowerCase();
    const kota = document.getElementById('kota-select').value;
    filtered = semuaDest
      .filter(d => !activeKat || d.category === activeKat)
      .filter(d => !kota || d.city === kota)
      .filter(d => !q || d.name.toLowerCase().includes(q));
    renderGrid();
    updateStats();
  }

  function updateStats() {
    const kategori = [...new Set(semuaDest.map(d => d.category))];
    document.getElementById('stat-total').textContent    = `${filtered.length} destinasi`;
    document.getElementById('stat-kategori').textContent = `${kategori.length} kategori`;
    document.getElementById('subtitle').textContent =
      `${filtered.length} dari ${semuaDest.length} destinasi tersedia`;
  }

  function renderGrid() {
    const grid = document.getElementById('dest-grid');
    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full text-center py-20">
          <span class="material-symbols-outlined text-5xl text-slate-300 block mb-3">search_off</span>
          <p class="text-slate-400 font-semibold">Tidak ada destinasi ditemukan</p>
        </div>`;
      return;
    }
    grid.innerHTML = filtered.map(dest => {
      const warna = getWarna(dest.category);
      const icon  = getIcon(dest.category);
      return `
        <div class="dest-card glass rounded-3xl overflow-hidden shadow-md" onclick="bukaDetail(${dest.id})">
          <!-- Icon area -->
          <div class="flex items-center justify-center h-36" style="background:${warna}18">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg" style="background:${warna}">
              <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">${icon}</span>
            </div>
          </div>
          <!-- Info -->
          <div class="p-4">
            <p class="font-display font-bold text-slate-800 text-sm leading-tight mb-1 line-clamp-2">${dest.name}</p>
            <p class="text-xs text-slate-400 flex items-center gap-1 mb-3">
              <span class="material-symbols-outlined text-[12px]">location_on</span>${dest.city}
            </p>
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold px-2 py-1 rounded-full" style="background:${warna}18;color:${warna}">${dest.category}</span>
              <span class="text-xs font-bold text-slate-700">${formatRp(dest.entrance_fee)}</span>
            </div>
            <div class="flex items-center gap-1 mt-2 text-slate-400">
              <span class="material-symbols-outlined text-[12px]">schedule</span>
              <span class="text-xs">${dest.average_duration_spent} menit</span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Modal detail ──────────────────────────────────────────────────
  function bukaDetail(id) {
    const dest = semuaDest.find(d => d.id === id);
    if (!dest) return;

    const warna = getWarna(dest.category);
    const icon  = getIcon(dest.category);

    // Badge
    const badge = document.getElementById('modal-kat');
    badge.style.background = warna + '20';
    badge.style.color = warna;
    badge.innerHTML = `<span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL' 1">${icon}</span>${dest.category}`;

    document.getElementById('modal-nama').textContent = dest.name;
    document.getElementById('modal-kota').querySelector('span:last-child').textContent = dest.city;
    document.getElementById('modal-fee').textContent = formatRp(dest.entrance_fee);
    document.getElementById('modal-dur').textContent = dest.average_duration_spent + ' menit';

    document.getElementById('modal').classList.remove('hidden');

    // Peta mini
    setTimeout(() => {
      const container = document.getElementById('modal-peta');
      container.innerHTML = '';
      if (miniMap) { miniMap.remove(); miniMap = null; }
      miniMap = L.map(container).setView([dest.latitude, dest.longitude], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(miniMap);
      L.marker([dest.latitude, dest.longitude], {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:38px;height:38px;background:${warna};border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.25)">
            <span class="material-symbols-outlined" style="color:#fff;font-size:18px;font-variation-settings:'FILL' 1">${icon}</span>
          </div>`,
          iconSize:[38,38],iconAnchor:[19,19],
        })
      }).addTo(miniMap).bindPopup(`<b>${dest.name}</b>`).openPopup();
    }, 100);
  }

  function tutupModal() {
    document.getElementById('modal').classList.add('hidden');
    if (miniMap) { miniMap.remove(); miniMap = null; }
  }

  muat();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
