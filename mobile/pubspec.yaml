name: travel_planner_mobile
description: "Aplikasi Travel Planner - Perencana perjalanan otomatis berbasis Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Penyimpanan token JWT lokal
  shared_preferences: ^2.2.2

  # Navigasi deklaratif
  go_router: ^13.0.0

  # Peta interaktif gratis (berbasis OpenStreetMap, tanpa API key)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Gambar dengan cache otomatis
  cached_network_image: ^3.3.1

  # Loading skeleton
  shimmer: ^3.0.0

  # Format mata uang Rupiah & tanggal Bahasa Indonesia
  intl: ^0.19.0

  # Equality comparison untuk model
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
